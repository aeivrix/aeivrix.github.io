# refreshes contrib.json (the pixel heatmap's data) once a day
name: contributions
on:
  schedule: [{ cron: "17 3 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch calendar
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh api graphql -f query='{user(login:"aeivrix"){contributionsCollection{contributionCalendar{totalContributions weeks{contributionDays{date contributionCount}}}}}}' \
            --jq '.data.user.contributionsCollection.contributionCalendar | {total: .totalContributions, days: [.weeks[].contributionDays[] | [.date, .contributionCount]]}' > contrib.json
      - name: commit if changed
        run: |
          git diff --quiet contrib.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "update contributions" && git push
      # pushes made with the workflow token don't kick off a pages build on their own
      - name: rebuild pages
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --jq .status
