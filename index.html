<script>
// 7-row lowercase pixel glyphs; each lit pixel becomes SUBxSUB ascii chars
const G = {
  a: [".....", ".....", ".###.", "....#", ".####", "#...#", ".####"],
  e: [".....", ".....", ".###.", "#...#", "#####", "#....", ".###."],
  i: ["#", ".", "#", "#", "#", "#", "#"],
  v: [".....", ".....", "#...#", "#...#", "#...#", ".#.#.", "..#.."],
  r: [".....", ".....", "#.##.", "##..#", "#....", "#....", "#...."],
  x: [".....", ".....", "#...#", ".#.#.", "..#..", ".#.#.", "#...#"],
};
const SUB = 5, SOLID = "#@%&$8B", rnd = Math.random;
const P = [];
let cols = 0;
for (const ch of "aeivrix") {
  G[ch].forEach((row, y) => [...row].forEach((c, x) => {
    if (c !== "#") return;
    for (let sy = 0; sy < SUB; sy++) for (let sx = 0; sx < SUB; sx++) P.push({
      gx: (cols + x) * SUB + sx, gy: y * SUB + sy,
      ch: SOLID[rnd() * SOLID.length | 0],
    });
  }));
  cols += G[ch][0].length + 1;
}
cols = (cols - 1) * SUB;
const rows = 7 * SUB;

const cv = document.getElementById("fx"), ctx = cv.getContext("2d"), slot = document.getElementById("slot");
const layer = document.createElement("canvas");
let cell = 0, ox = 0, oy = 0, W = 0;
function size() {
  const dpr = devicePixelRatio || 1;
  cell = Math.max(3, Math.floor(Math.min(slot.clientWidth / cols, 6)));
  slot.style.height = rows * cell + "px";
  const b = slot.getBoundingClientRect();
  ox = b.left; oy = b.top; W = innerWidth;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.font = `bold ${cell * 1.25}px ui-monospace, Menlo, monospace`;
  ctx.textBaseline = "top";
  // the name never moves: draw it offscreen, then onto the page
  layer.width = cv.width; layer.height = cv.height;
  const n = layer.getContext("2d");
  n.setTransform(dpr, 0, 0, dpr, 0, 0);
  n.font = ctx.font; n.textBaseline = "top"; n.fillStyle = "#fff";
  for (const p of P) n.fillText(p.ch, ox + p.gx * cell, oy + p.gy * cell);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); ctx.drawImage(layer, 0, 0);
}
addEventListener("resize", size);
size();
document.fonts.ready.then(size); // text font shifts layout once it loads

const still = matchMedia("(prefers-reduced-motion: reduce)").matches;

// gutter: black & white blossom branches reaching in from the right edge, over the border.
// generated from a fixed seed, they sway a touch and drop the odd petal. not interactive.
{
  const bg = document.getElementById("bg"), g = bg.getContext("2d");
  let seed = 7;
  const rand = () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const rr = (a, b) => a + rand() * (b - a), TAU = Math.PI * 2;

  function petal(c, r) { // one petal along +x: wavy rim, notched tip, dark base, cupped edges, veins
    const w = r * rr(0.55, 0.68), j = () => rr(-0.04, 0.04) * r;
    c.beginPath(); c.moveTo(0, 0);
    c.bezierCurveTo(r * 0.2, -w * 0.7 + j(), r * 0.55, -w * 1.05 + j(), r * 0.85, -w * 0.7 + j());
    c.quadraticCurveTo(r * 1.0, -w * 0.4, r * 0.97, -w * 0.12);
    c.quadraticCurveTo(r * 0.9, rr(-0.04, 0.04) * w, r * 0.97, w * 0.12);
    c.quadraticCurveTo(r * 1.0, w * 0.4, r * 0.85, w * 0.7 + j());
    c.bezierCurveTo(r * 0.55, w * 1.05 + j(), r * 0.2, w * 0.7 + j(), 0, 0);
    const along = c.createLinearGradient(0, 0, r, 0);
    along.addColorStop(0, "#5a5a5a"); along.addColorStop(0.3, "#d8d8d8"); along.addColorStop(0.75, "#f6f6f6"); along.addColorStop(1, "#e2e2e2");
    c.fillStyle = along; c.fill();
    const across = c.createLinearGradient(0, -w, 0, w); // edges curl away from the light
    across.addColorStop(0, "rgba(0,0,0,.28)"); across.addColorStop(0.35, "rgba(0,0,0,0)");
    across.addColorStop(0.65, "rgba(0,0,0,0)"); across.addColorStop(1, "rgba(0,0,0,.18)");
    c.fillStyle = across; c.fill();
    c.strokeStyle = "rgba(0,0,0,.16)"; c.lineWidth = Math.max(0.5, r * 0.012);
    for (const k of [-0.35, 0, 0.35]) { c.beginPath(); c.moveTo(r * 0.12, 0); c.quadraticCurveTo(r * 0.5, w * k * 0.6, r * 0.82, w * k); c.stroke(); }
  }
  function flower(c, x, y, r, open) {
    c.save(); c.translate(x, y); c.rotate(rr(0, TAU)); c.scale(1, rr(0.5, 1)); // tilted towards/away from us
    const off = rr(0, TAU), n = open ? 5 : 3;
    for (let k = 0; k < n; k++) {
      c.save(); c.rotate(off + k / n * (open ? TAU : 2.2) + rr(-0.18, 0.18));
      petal(c, r * (open ? rr(0.85, 1.05) : rr(0.55, 0.7))); c.restore();
    }
    if (open) {
      const h = c.createRadialGradient(0, 0, 0, 0, 0, r * 0.4);
      h.addColorStop(0, "#111"); h.addColorStop(0.6, "rgba(25,25,25,.6)"); h.addColorStop(1, "rgba(30,30,30,0)");
      c.fillStyle = h; c.beginPath(); c.arc(0, 0, r * 0.4, 0, TAU); c.fill();
      c.lineWidth = Math.max(0.4, r * 0.018);
      for (let k = 0; k < 22; k++) { // stamens: pale filaments, grey anthers
        const a = rr(0, TAU), l = r * rr(0.2, 0.45), sx = Math.cos(a) * l, sy = Math.sin(a) * l;
        c.strokeStyle = "rgba(220,220,220,.8)"; c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(sx * 0.5 + rr(-2, 2), sy * 0.5 + rr(-2, 2), sx, sy); c.stroke();
        c.fillStyle = rand() < 0.3 ? "#eee" : "#8a8a8a"; c.beginPath(); c.arc(sx, sy, r * rr(0.025, 0.045), 0, TAU); c.fill();
      }
    }
    c.restore();
  }
  function bud(c, x, y, r, a) {
    c.save(); c.translate(x, y); c.rotate(a);
    const gr = c.createRadialGradient(r * 0.3, -r * 0.2, 0, 0, 0, r);
    gr.addColorStop(0, "#f2f2f2"); gr.addColorStop(1, "#555");
    c.fillStyle = gr; c.beginPath(); c.ellipse(0, 0, r, r * 0.62, 0, 0, TAU); c.fill();
    c.fillStyle = "#222"; c.beginPath(); c.ellipse(-r * 0.85, 0, r * 0.35, r * 0.4, 0, 0, TAU); c.fill(); // sepals
    c.restore();
  }
  function leaf(c, x, y, r, a) {
    c.save(); c.translate(x, y); c.rotate(a);
    const gr = c.createLinearGradient(0, -r * 0.4, 0, r * 0.4);
    gr.addColorStop(0, "#3c3c3c"); gr.addColorStop(0.5, "#262626"); gr.addColorStop(1, "#121212");
    c.fillStyle = gr; c.beginPath(); c.moveTo(0, 0);
    c.bezierCurveTo(r * 0.3, -r * 0.42, r * 0.75, -r * 0.3, r, 0); c.bezierCurveTo(r * 0.75, r * 0.3, r * 0.3, r * 0.42, 0, 0); c.fill();
    c.strokeStyle = "rgba(255,255,255,.12)"; c.lineWidth = 0.8; c.beginPath(); c.moveTo(0, 0); c.lineTo(r * 0.9, 0); c.stroke();
    c.restore();
  }
  // a blossom, sometimes out of focus / in shadow so the cluster has depth
  function bloom(c, x, y, rad, bx, by) {
    c.strokeStyle = "#2a2a2a"; c.lineWidth = Math.max(1, rad * 0.06); // pedicel back to the twig
    c.beginPath(); c.moveTo(bx, by); c.quadraticCurveTo((bx + x) / 2 + rr(-4, 4), (by + y) / 2 + rr(-4, 4), x, y); c.stroke();
    const depth = rand();
    c.save();
    c.globalAlpha = depth < 0.25 ? 0.45 : depth < 0.5 ? 0.75 : 1;
    if (depth < 0.25) c.filter = "blur(2px)";
    flower(c, x, y, rad, rand() > 0.15);
    c.restore();
  }
  function grow(c, x, y, a, len, w, depth, tips) {
    const bend = rr(-0.35, 0.35);
    const mx = x + Math.cos(a + bend * 0.5) * len * 0.5, my = y + Math.sin(a + bend * 0.5) * len * 0.5;
    const ex = x + Math.cos(a + bend) * len, ey = y + Math.sin(a + bend) * len;
    c.lineCap = "round";
    for (let q = 0; q < 6; q++) { // taper along the segment, with a bit of bark light on one side
      const t0 = q / 6, t1 = (q + 1) / 6, P = tt => [(1 - tt) ** 2 * x + 2 * (1 - tt) * tt * mx + tt * tt * ex, (1 - tt) ** 2 * y + 2 * (1 - tt) * tt * my + tt * tt * ey];
      const [x0, y0] = P(t0), [x1, y1] = P(t1), ww = w * (1 - t0 * 0.3);
      c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1);
      c.strokeStyle = "#262626"; c.lineWidth = ww; c.stroke();
      c.strokeStyle = "rgba(255,255,255,.09)"; c.lineWidth = ww * 0.25;
      c.beginPath(); c.moveTo(x0 - ww * 0.25, y0 - ww * 0.25); c.lineTo(x1 - ww * 0.25, y1 - ww * 0.25); c.stroke();
    }
    if (rand() < 0.4) { c.fillStyle = "#303030"; c.beginPath(); c.arc(ex, ey, w * 0.55, 0, TAU); c.fill(); } // knot
    tips.push([ex, ey, a + bend, depth, mx, my]);
    if (depth <= 0) return;
    const kids = depth > 2 ? 2 : 1 + (rand() < 0.5);
    for (let k = 0; k < kids; k++) grow(c, ex, ey, a + bend + rr(-0.75, 0.75), len * rr(0.6, 0.8), w * 0.7, depth - 1, tips);
  }

  let clusters = [], spots = [], r = 20;
  function layout() {
    const dpr = devicePixelRatio || 1, W = innerWidth, H = innerHeight, m = Math.min(W, H);
    bg.width = W * dpr; bg.height = H * dpr;
    seed = 7; spots = [];
    r = Math.max(10, Math.min(30, m * 0.04));
    const reach = m * 0.3;
    // anchor x, anchor y, direction, size, depth
    clusters = [[W + 8, H * 0.02, Math.PI - 1.05, reach, 4], [W * 0.93, H + 8, -Math.PI / 2 - 0.55, reach * 0.85, 4],
      [-8, H * 0.98, -Math.PI / 2 + 0.3, reach * 0.6, 3], [-8, -8, Math.PI / 2 - 0.35, reach * 0.45, 3]].map(([ax, ay, a, len, d], i) => {
      const cv = document.createElement("canvas"); cv.width = W * dpr; cv.height = H * dpr;
      const c = cv.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0);
      const tips = [];
      grow(c, ax, ay, a, len * 0.55, Math.max(3, r * 0.3), d, tips);
      for (const [x, y, ang, depth, mx, my] of tips) {
        if (rand() < 0.5) leaf(c, mx, my, r * rr(0.9, 1.4), ang + rr(-1.3, 1.3));
        if (depth <= 2) {
          const n = 1 + (rand() < 0.45);
          for (let k = 0; k < n; k++) {
            const fx = x + rr(-1.6, 1.6) * r, fy = y + rr(-1.6, 1.6) * r;
            bloom(c, fx, fy, r * rr(0.75, 1.1), x, y); spots.push([fx, fy]);
          }
          if (rand() < 0.6) bud(c, x + Math.cos(ang) * r * 1.3, y + Math.sin(ang) * r * 1.3, r * 0.3, ang);
        }
      }
      return { cv, ax, ay, ph: i * 2.1 };
    });
  }
  addEventListener("resize", layout);
  layout();

  const falling = Array.from({ length: 6 }, () => ({ wait: rr(0, 12) }));
  function drop(p) {
    const [x, y] = spots[rand() * spots.length | 0];
    Object.assign(p, { x, y, vy: rr(10, 22), ph: rr(0, TAU), rot: rr(0, TAU), vr: rr(-0.8, 0.8), s: r * rr(0.35, 0.5), wait: 0 });
  }
  let prev = 0;
  function draw(ms) {
    const t = still ? 0 : ms / 1000, dt = Math.min(0.05, (ms - prev) / 1000), dpr = devicePixelRatio || 1; prev = ms;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, bg.width, bg.height);
    for (const cl of clusters) { // gentle sway around where each branch enters the screen
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.translate(cl.ax, cl.ay); g.rotate(0.012 * Math.sin(t * 0.5 + cl.ph)); g.translate(-cl.ax, -cl.ay);
      g.drawImage(cl.cv, 0, 0, innerWidth, innerHeight);
    }
    if (!still) for (const p of falling) {
      if (p.wait > 0) { p.wait -= dt; if (p.wait <= 0) drop(p); continue; }
      p.y += p.vy * dt; p.rot += p.vr * dt;
      const x = p.x + Math.sin(t * 0.8 + p.ph) * 18;
      if (p.y > innerHeight + 20) { p.wait = rr(2, 10); continue; }
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.translate(x, p.y); g.rotate(p.rot); g.scale(1, 0.6 + 0.4 * Math.sin(t * 1.5 + p.ph)); // flutter
      g.globalAlpha = 0.85; petal(g, p.s); g.globalAlpha = 1;
    }
    if (!still) requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
}
</script>
</body>
</html>
