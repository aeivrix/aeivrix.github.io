        const dx = px + p.ox - mx, dy = py + p.oy - my, d2 = dx * dx + dy * dy;
        if (d2 < R2 && d2 > 0.01) { const d = Math.sqrt(d2), f = (1 - d / R) * 2600 * cell * dt; p.vx += dx / d * f; p.vy += dy / d * f; }
        p.vx += (-p.ox * 140 - p.vx * 13) * dt; p.vy += (-p.oy * 140 - p.vy * 13) * dt; // spring home
        p.ox += p.vx * dt; p.oy += p.vy * dt;
        const off = Math.abs(p.ox) + Math.abs(p.oy);
        if (off > 0.05 || Math.abs(p.vx) + Math.abs(p.vy) > 0.5) busy = true; else p.ox = p.oy = p.vx = p.vy = 0;
        if (off > cell * 1.5 && rnd() < 0.15) p.c = rnd() * SOLID.length | 0; // knocked chars reshuffle
      }
      const young = ms - p.at < 260; // just decoded: still flickering noise
      if (young) busy = true;
      const g = young ? SOLID.length + (rnd() * NOISE.length | 0) : p.c;
      c.drawImage(atlas[g], px + p.ox, py + p.oy, as, as);
    }
    running = busy && !still;
    if (running) requestAnimationFrame(frame);
  }
  // wake the loop when the cursor comes near the name; it sleeps again once everything settles
  addEventListener("pointermove", () => {
    if (running || still) return;
    const r = cv.getBoundingClientRect(), R = cell * 9;
    if (ptr.x > r.left - R && ptr.x < r.right + R && ptr.y > r.top - R && ptr.y < r.bottom + R) { running = true; prev = performance.now(); requestAnimationFrame(frame); }
  });
  window.sizeName = size;
  size();
  if (!still) { running = true; requestAnimationFrame(frame); }
}

// ---- blossoms: geometry comes from blossom.wasm (rust, see blossom/src/lib.rs); a new seed every visit
let seed = 0;
const hex = () => "0x" + seed.toString(16).padStart(8, "0");
const garden = {}; // regrow / sweep, used by the shell and the seed link
{
  const seedEl = document.getElementById("seed");
  const newSeed = () => { seed = crypto.getRandomValues(new Uint32Array(1))[0]; seedEl.textContent = hex(); };
  newSeed();
  const bg = document.getElementById("bg"), g = bg.getContext("2d");
  let wasm, spots = [], sprite, sw = 0, sh = 0, piled = 0;
  // replay the rust command stream; opcodes/arities must match blossom/src/lib.rs
  function replay(c, b) {
    const S = (k, a) => `rgba(${k},${k},${k},${a})`;
    const fillGrad = gr => { const n = b[i++]; for (let k = 0; k < n; k++, i += 3) gr.addColorStop(b[i], S(b[i + 1], b[i + 2])); c.fillStyle = gr; c.fill(); };
    let i = 0;
    while (i < b.length) switch (b[i++]) {
      case 0: c.save(); break;
      case 1: c.restore(); break;
      case 2: c.translate(b[i], b[i + 1]); i += 2; break;
      case 3: c.rotate(b[i++]); break;
      case 4: c.scale(b[i], b[i + 1]); i += 2; break;
      case 5: c.beginPath(); break;
      case 6: c.moveTo(b[i], b[i + 1]); i += 2; break;
      case 7: c.lineTo(b[i], b[i + 1]); i += 2; break;
      case 8: c.quadraticCurveTo(b[i], b[i + 1], b[i + 2], b[i + 3]); i += 4; break;
      case 9: c.bezierCurveTo(b[i], b[i + 1], b[i + 2], b[i + 3], b[i + 4], b[i + 5]); i += 6; break;
      case 10: c.arc(b[i], b[i + 1], b[i + 2], 0, TAU); i += 3; break;
      case 11: c.ellipse(b[i], b[i + 1], b[i + 2], b[i + 3], 0, 0, TAU); i += 4; break;
      case 12: c.fillStyle = S(b[i], b[i + 1]); c.fill(); i += 2; break;
      case 13: c.strokeStyle = S(b[i], b[i + 1]); c.lineWidth = b[i + 2]; c.stroke(); i += 3; break;
      case 14: { const gr = c.createLinearGradient(b[i], b[i + 1], b[i + 2], b[i + 3]); i += 4; fillGrad(gr); break; }
      case 15: { const gr = c.createRadialGradient(b[i], b[i + 1], b[i + 2], b[i + 3], b[i + 4], b[i + 5]); i += 6; fillGrad(gr); break; }
      case 16: c.globalAlpha = b[i++]; break;
      case 18: c.lineCap = "round"; break;
    }
  }
  const commands = n => new Float32Array(wasm.memory.buffer, wasm.commands(), n); // fresh view: memory may have grown
  const pc = document.getElementById("petals"), pg = pc.getContext("2d");
  let dpr = 1;
  // branches are drawn once per layout straight into #bg; nothing redraws them per frame
  function layout() {
    dpr = Math.min(2, devicePixelRatio || 1);
    const W = innerWidth, H = innerHeight, m = Math.min(W, H);
    bg.width = pc.width = W * dpr; bg.height = pc.height = H * dpr; // also wipes the petal pile
    piled = 0;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const k = W < 700 ? 0.7 : 1; // smaller trees on phones so they stay off the text
    const r = Math.max(8, Math.min(30, m * 0.04)) * k, reach = m * 0.3 * k;
    wasm.reset(seed);
    // anchor x, anchor y, heading, reach, depth
    for (const [ax, ay, a, len, d] of [[W + 8, H * 0.02, Math.PI - 1.05, reach, 4], [W * 0.93, H + 8, -Math.PI / 2 - 0.55, reach * 0.85, 4],
      [-8, H * 0.98, -Math.PI / 2 + 0.3, reach * 0.6, 3], [-8, -8, Math.PI / 2 - 0.35, reach * 0.45, 3]]) {
      g.save(); replay(g, commands(wasm.cluster(ax, ay, a, len, d, r))); g.restore();
    }
    spots = Array.from(new Float32Array(wasm.memory.buffer, wasm.spots(), wasm.spot_count() * 2));
    // one loose petal, drawn once, reused for every falling petal
    const s = r * 0.5; sw = s * 1.1 + 4; sh = s * 1.6;
    sprite = sprite || document.createElement("canvas");
    sprite.width = Math.ceil(sw * dpr); sprite.height = Math.ceil(sh * dpr);
    const c = sprite.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.translate(2, sh / 2);
    replay(c, commands(wasm.petal(s)));
  }

  const falling = Array.from({ length: 7 }, () => ({ wait: rnd() * 10 }));
  function drop(p) {
    const k = (rnd() * spots.length / 2 | 0) * 2, fall = 10 + rnd() * 12;
    Object.assign(p, { x: spots[k], y: spots[k + 1], vy: fall, fall, ph: rnd() * TAU, rot: rnd() * TAU, vr: rnd() * 1.6 - 0.8, k: 0.7 + rnd() * 0.3, wait: 0 });
  }
  function settle(p) { p.wait = 2 + rnd() * 8; }
  function land(p, x) { // stamp the petal into #bg so the pile costs nothing per frame
    if (piled > 220) return;
    piled++;
    g.save(); g.globalAlpha = 0.5 + rnd() * 0.35;
    g.translate(x, innerHeight - 2 - rnd() * Math.min(14, piled / 12)); g.rotate((rnd() - 0.5) * 0.8); g.scale(p.k, p.k * 0.45);
    g.drawImage(sprite, -sw / 2, -sh / 2, sw, sh); g.restore();
  }

  let prev = 0;
  // cursor trail: tiny petals shed from the cursor that flutter down and fade; mouse only, not touch
  const trail = [], tx = { x: 0, y: 0 };
  addEventListener("pointermove", e => {
    ptr.x = e.clientX; ptr.y = e.clientY;
    if (still || !sprite || e.pointerType !== "mouse" || Math.hypot(e.clientX - tx.x, e.clientY - tx.y) < 16) return;
    tx.x = e.clientX; tx.y = e.clientY;
    trail.push({ x: e.clientX, y: e.clientY, vx: (rnd() - .5) * 30, age: 0, life: 0.9 + rnd() * 0.5, rot: rnd() * TAU, vr: (rnd() - .5) * 6, ph: rnd() * TAU, k: 0.5 + rnd() * 0.3 });
    if (trail.length > 30) trail.shift();
  });
  function draw(ms) { // only the falling petals animate: a clear plus a few small sprites per frame
    const t = ms / 1000, dt = Math.min(0.05, (ms - prev) / 1000); prev = ms;
    pg.setTransform(1, 0, 0, 1, 0, 0);
    pg.clearRect(0, 0, pc.width, pc.height);
    for (const p of falling) {
      if (p.wait > 0) { p.wait -= dt; if (p.wait <= 0 && spots.length) drop(p); continue; }
      p.y += p.vy * dt; p.rot += p.vr * dt;
      const x = p.x + Math.sin(t * 0.8 + p.ph) * 18;
      if (p.y > innerHeight - 4) { land(p, x); settle(p); continue; }
      if (x < -40 || x > innerWidth + 40 || p.y < -60) { settle(p); continue; }
      pg.setTransform(dpr, 0, 0, dpr, 0, 0);
      pg.translate(x, p.y); pg.rotate(p.rot);
      pg.scale(p.k, p.k * (0.6 + 0.4 * Math.sin(t * 1.5 + p.ph))); // flutter
      pg.globalAlpha = 0.85; pg.drawImage(sprite, -sw / 2, -sh / 2, sw, sh); pg.globalAlpha = 1;
    }
    for (let i = trail.length - 1; i >= 0; i--) {
      const s = trail[i]; s.age += dt;
      if (s.age > s.life) { trail.splice(i, 1); continue; }
      s.x += s.vx * dt; s.y += (8 + s.age * 40) * dt; s.rot += s.vr * dt; s.vx *= Math.pow(0.4, dt);
      const f = 1 - s.age / s.life;
      pg.setTransform(dpr, 0, 0, dpr, 0, 0);
      pg.translate(s.x + Math.sin(s.age * 5 + s.ph) * 4, s.y); pg.rotate(s.rot);
      pg.scale(s.k, s.k * (0.5 + 0.5 * Math.sin(s.age * 9 + s.ph)));
      pg.globalAlpha = Math.min(1, f * 1.6) * 0.9; pg.drawImage(sprite, -sw / 2, -sh / 2, sw, sh);
    }
    pg.globalAlpha = 1;
    requestAnimationFrame(draw);
  }
  garden.regrow = () => {
    newSeed();
    if (!wasm) return;
    layout();
    for (const p of falling) settle(p);
    trail.length = 0;
    if (!still) bg.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 1400, easing: "ease-out" });
  };
  garden.sweep = () => { if (wasm) layout(); return piled; };
  garden.piled = () => piled;
  seedEl.addEventListener("click", e => { e.preventDefault(); garden.regrow(); });
  // one relayout after resizing settles, instead of one per resize event
  let pending;
  addEventListener("resize", () => { clearTimeout(pending); pending = setTimeout(() => { window.sizeName(); if (wasm) layout(); }, 150); });
  WebAssembly.instantiateStreaming(fetch("blossom.wasm")).then(({ instance }) => {
    wasm = instance.exports; layout(); if (!still) requestAnimationFrame(draw);
  }).catch(() => {}); // no wasm, no flowers; the page still works
}

// ---- live data: contribution heatmap (contrib.json, refreshed daily by an action), merged prs, repos
const live = { repos: [], prs: [], prTotal: 0, contribs: null };
{
  const USER = "aeivrix";
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const ago = iso => { const d = (Date.now() - new Date(iso)) / 864e5; return d < 1 ? "today" : d < 30 ? `${d | 0}d ago` : d < 365 ? `${d / 30 | 0}mo ago` : `${d / 365 | 0}y ago`; };
  const getJSON = url => fetch(url).then(r => r.ok ? r.json() : null).catch(() => null);
  const row = (href, top, bottom) => {
    const li = el("li"), a = el("a"); a.href = href;
    a.append(top, el("br"), el("span", "dim", bottom)); li.append(a); return li;
  };

  getJSON("contrib.json").then(d => {
    if (!d || !d.total) return;
    live.contribs = d.total;
    const C = 5, GAP = 1, S = C + GAP, first = new Date(d.days[0][0] + "T00:00:00Z").getUTCDay();
    const weeks = Math.ceil((d.days.length + first) / 7), max = Math.max(...d.days.map(x => x[1]));
    const cv = document.getElementById("heatmap"), dpr = devicePixelRatio || 1, w = weeks * S, h = 7 * S;
    cv.style.width = w + "px"; cv.style.height = h + "px"; cv.width = w * dpr; cv.height = h * dpr;
    const c = cv.getContext("2d"); c.scale(dpr, dpr);
    const paint = hl => d.days.forEach(([, n], k) => {
      const i = k + first, lvl = n ? Math.ceil(n / max * 4) : 0;
      c.fillStyle = k === hl ? (n ? "#fff" : "#555") : ["#161616", "#4a4a4a", "#808080", "#b8b8b8", "#fff"][lvl];
      c.fillRect((i / 7 | 0) * S, (i % 7) * S, C, C);
      if (k === hl) { c.fillStyle = "#000"; c.fillRect((i / 7 | 0) * S + 2, (i % 7) * S + 2, 1, 1); }
    });
    paint(-1);
    const title = document.getElementById("heat-title"), base = `contributions · ${d.total} in the last year`;
    title.textContent = base;
    const day = iso => new Date(iso + "T00:00:00Z").toLocaleDateString("en", { month: "short", day: "numeric", timeZone: "UTC" }).toLowerCase();
    let last = -1;
    cv.addEventListener("pointermove", e => {
      const r = cv.getBoundingClientRect(), k = ((e.clientX - r.left) / S | 0) * 7 + ((e.clientY - r.top) / S | 0) - first;
      if (k === last) return;
      last = k; paint(k);
      const hit = d.days[k];
      title.textContent = hit ? `${day(hit[0])} · ${hit[1] || "no"} contribution${hit[1] === 1 ? "" : "s"}` : base;
    });
    cv.addEventListener("pointerleave", () => { last = -1; paint(-1); title.textContent = base; });
    document.getElementById("heat").hidden = false;
  });

  const q = encodeURIComponent(`author:${USER} type:pr is:merged -user:${USER}`);
  getJSON(`https://api.github.com/search/issues?q=${q}&sort=updated&order=desc&per_page=4`).then(d => {
    if (!d || !d.items || !d.items.length) return;
    live.prTotal = d.total_count;
    live.prs = d.items.map(i => ({ title: i.title, url: i.html_url, repo: i.repository_url.split("/repos/")[1], at: (i.pull_request && i.pull_request.merged_at) || i.closed_at }));
    const ul = document.querySelector("#prs ul");
    for (const p of live.prs) ul.append(row(p.url, el("span", null, "✓ " + p.title), `${p.repo} · ${ago(p.at)}`));
    document.getElementById("prs").hidden = false;
  });

  getJSON(`https://api.github.com/users/${USER}/repos?sort=pushed&per_page=30`).then(list => {
    if (!Array.isArray(list)) return;
    live.repos = list.filter(r => !r.fork && r.name !== USER).slice(0, 3)
      .map(r => ({ name: r.name, url: r.html_url, lang: (r.language || "").toLowerCase(), stars: r.stargazers_count, desc: r.description || "", at: r.pushed_at }));
    if (!live.repos.length) return;
    const ul = document.querySelector("#repos ul");
    for (const r of live.repos) {
      const top = el("span"); top.append(r.name + "  ", el("span", "dim", [r.lang, r.stars ? "★" + r.stars : ""].filter(Boolean).join(" ")));
      ul.append(row(r.url, top, r.desc || `updated ${ago(r.at)}`));
    }
    document.getElementById("repos").hidden = false;
  });
}

// ---- hidden shell: press ~ (or click "~ shell")
{
  const term = document.getElementById("term"), out = document.getElementById("tout"), inp = document.getElementById("tin");
  const print = s => { out.append(s + "\n"); out.scrollTop = out.scrollHeight; };
  // github profile picture, 1-bit floyd-steinberg dithered, revealed a few rows per frame
  let user;
  const getUser = () => user = user || fetch("https://api.github.com/users/aeivrix").then(r => r.ok ? r.json() : null).catch(() => null);
  function dither(cv, src) {
    const N = cv.width, img = new Image(); img.crossOrigin = "anonymous";
    img.onload = () => {
      const c = cv.getContext("2d"); c.drawImage(img, 0, 0, N, N);
      const d = c.getImageData(0, 0, N, N), px = d.data, L = new Float32Array(N * N);
      for (let i = 0; i < N * N; i++) L[i] = px[i * 4] * .3 + px[i * 4 + 1] * .59 + px[i * 4 + 2] * .11;
      // auto-levels: stretch the 2nd..98th percentile to full range, gamma lifts the shadows
      const q = Float32Array.from(L).sort(), lo = q[N * N * .02 | 0], hi = Math.max(lo + 1, q[N * N * .98 | 0]);
      for (let i = 0; i < N * N; i++) L[i] = 255 * Math.pow(Math.min(1, Math.max(0, (L[i] - lo) / (hi - lo))), 0.65);
      // atkinson: spreads only 6/8 of the error, so highlights stay clean and midtones keep detail
      const add = (x, y, e) => { if (x >= 0 && x < N && y < N) L[y * N + x] += e; };
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
        const i = y * N + x, v = L[i] < 128 ? 0 : 255, e = (L[i] - v) / 8; L[i] = v;
        add(x + 1, y, e); add(x + 2, y, e); add(x - 1, y + 1, e); add(x, y + 1, e); add(x + 1, y + 1, e); add(x, y + 2, e);
      }
      for (let i = 0; i < N * N; i++) { px[i * 4] = px[i * 4 + 1] = px[i * 4 + 2] = L[i]; px[i * 4 + 3] = 255; }
      c.clearRect(0, 0, N, N);
      let y = 0;
      const step = () => { c.putImageData(d, 0, 0, 0, y, N, 5); y += 5; if (y < N) requestAnimationFrame(step); };
      still ? c.putImageData(d, 0, 0) : step();
    };
    img.src = src;
  }
  const cmds = {
    help: () => "whoami  neofetch  ls  prs  cat stack  bloom  sweep  seed  date  echo  open github  clear  exit\n(tab completes, ↑ recalls)",
    whoami: () => "aeivrix. builds and ships in rust, python, typescript and c. contributes to open source.",
    neofetch: () => {
      const box = document.createElement("div"), cv = document.createElement("canvas"), txt = document.createElement("div");
      box.className = "nf"; cv.width = cv.height = 200; cv.setAttribute("aria-hidden", "true");
      box.append(cv, txt); out.append(box); out.scrollTop = out.scrollHeight;
      const lines = u => ["aeivrix@web", "-----------",
        ...(u ? [`joined    ${new Date(u.created_at).getFullYear()}`, `profile   ${u.public_repos} public repo${u.public_repos === 1 ? "" : "s"} · ${u.followers} follower${u.followers === 1 ? "" : "s"}`] : []),
        "stack     rust · python · typescript · c",
        "contribs  " + (live.contribs != null ? `${live.contribs} in the last year` : "loading"),
        "merged    " + (live.prTotal ? `${live.prTotal} prs to other repos` : "none to show yet"),
        "repos     " + (live.repos.map(r => r.name).join(", ") || "none public yet"),
        "seed      " + hex(), "petals    " + garden.piled() + " on the ground"].join("\n");
      txt.textContent = lines();
      getUser().then(u => {
        if (!u) { cv.remove(); return; }
        txt.textContent = lines(u); dither(cv, u.avatar_url + "&s=400"); out.scrollTop = out.scrollHeight;
      });
    },
    ls: () => live.repos.length ? live.repos.map(r => `${r.name}  ${r.lang}`).join("\n") : "nothing public yet",
    prs: () => live.prs.length ? live.prs.map(p => `✓ ${p.title}  (${p.repo})`).join("\n") : "no merged prs to show yet",
    "cat stack": () => "rust · python · typescript · c",
    seed: () => `${hex()}. type bloom for a new tree`,
    bloom: () => (garden.regrow(), `regrown from seed ${hex()}`),
    sweep: () => { const n = garden.sweep(); return n ? `swept up ${n} petal${n === 1 ? "" : "s"}` : "nothing to sweep yet. petals pile up as they fall"; },
    date: () => new Date().toString().toLowerCase(),
    "open github": () => (open("https://github.com/aeivrix", "_blank", "noopener"), "opening github.com/aeivrix"),
    clear: () => { out.textContent = ""; },
    exit: () => { toggle(false); },
  };
  const hist = []; let hi = 0;
  function toggle(on) {
    term.hidden = !on;
    if (on) { if (!out.textContent) print("type help."); inp.focus(); } else inp.blur();
  }
  addEventListener("keydown", e => {
    if ((e.key === "`" || e.key === "~") && document.activeElement !== inp) { e.preventDefault(); toggle(term.hidden); }
    else if (e.key === "Escape" && !term.hidden) toggle(false);
  });
  inp.addEventListener("keydown", e => {
    if (e.key === "Tab") {
      e.preventDefault();
      const v = inp.value.trimStart(), hits = Object.keys(cmds).filter(k => k.startsWith(v));
      if (hits.length === 1) inp.value = hits[0];
      else if (hits.length > 1 && v) print(hits.join("  "));
      return;
    }
    if (e.key === "ArrowUp" || e.key === "ArrowDown") {
      e.preventDefault();
      hi = Math.max(0, Math.min(hist.length, hi + (e.key === "ArrowUp" ? -1 : 1)));
      inp.value = hist[hi] || "";
      return;
    }
    if (e.key !== "Enter") return;
    const c = inp.value.trim().replace(/\s+/g, " "); inp.value = "";
    print("aeivrix@web:~$ " + c);
    if (!c) return;
    hist.push(c); hi = hist.length;
    const f = c.startsWith("sudo") ? () => "nice try." : c.startsWith("echo") ? () => c.slice(5) : cmds[c === "ls projects" ? "ls" : c];
    const res = f ? f() : `command not found: ${c}. try help`;
    if (res) print(res);
  });
  document.getElementById("shell").addEventListener("click", e => { e.preventDefault(); toggle(true); });
}
</script>
</body>
</html>
