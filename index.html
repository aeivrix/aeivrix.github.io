  a {

    margin-top: 1.5rem; padding: .1em .3em; margin-left: -.3em;
    font-size: clamp(16px, 1.7vw, 21px); color: #fff; text-decoration: none;
  }
  a svg { width: 1em; height: 1em; fill: currentColor; }
  .langs { display: flex; gap: 1.1rem; margin-top: 1.25rem; padding: 0; list-style: none; }
  .langs svg { width: 22px; height: 22px; fill: #888; transition: fill .2s, transform .2s; }
  .langs li:hover svg { fill: #fff; transform: translateY(-3px); }
  a:hover, a:focus-visible { background: #fff; color: #000; outline: none; }

<canvas id="bg" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>
<script>
// 7-row lowercase pixel glyphs; each lit pixel becomes SUBxSUB ascii chars
const G = {
  a: [".....", ".....", ".###.", "....#", ".####", "#...#", ".####"],
  e: [".....", ".....", ".###.", "#...#", "#####", "#....", ".###."],
  i: ["#", ".", "#", "#", "#", "#", "#"],
  v: [".....", ".....", "#...#", "#...#", "#...#", ".#.#.", "..#.."],
  r: [".....", ".....", "#.##.", "##..#", "#....", "#....", "#...."],
  x: [".....", ".....", "#...#", ".#.#.", "..#..", ".#.#.", "#...#"],
};
const SUB = 5, SOLID = "#@%&$8B", DUST = "*+=:-~.'`", rnd = Math.random;
const P = [];
let cols = 0;
for (const ch of "aeivrix") {
  G[ch].forEach((row, y) => [...row].forEach((c, x) => {
    if (c !== "#") return;
    for (let sy = 0; sy < SUB; sy++) for (let sx = 0; sx < SUB; sx++) P.push({
      gx: (cols + x) * SUB + sx, gy: y * SUB + sy,
      ch: SOLID[rnd() * SOLID.length | 0],
    });
  }));
  cols += G[ch][0].length + 1;
}
cols = (cols - 1) * SUB;
const rows = 7 * SUB;

const cv = document.getElementById("fx"), ctx = cv.getContext("2d"), slot = document.getElementById("slot");
const layer = document.createElement("canvas");
let cell = 0, ox = 0, oy = 0, W = 0;
function size() {
  const dpr = devicePixelRatio || 1;
  cell = Math.max(3, Math.floor(Math.min(slot.clientWidth / cols, 6)));
  slot.style.height = rows * cell + "px";
  const b = slot.getBoundingClientRect();
  ox = b.left; oy = b.top; W = innerWidth;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.font = `bold ${cell * 1.25}px ui-monospace, Menlo, monospace`;
  ctx.textBaseline = "top";
  // the name never moves, so draw it once offscreen and blit it each frame
  layer.width = cv.width; layer.height = cv.height;
  const n = layer.getContext("2d");
  n.setTransform(dpr, 0, 0, dpr, 0, 0);
  n.font = ctx.font; n.textBaseline = "top"; n.fillStyle = "#fff";
  for (const p of P) n.fillText(p.ch, ox + p.gx * cell, oy + p.gy * cell);
}
addEventListener("resize", size);
size();
document.fonts.ready.then(size); // text font shifts layout once it loads

// name stays put; dust keeps shedding off random spots of it and drifting away
const RATE = 24, LIFE = 4.5; // particles per frame, seconds each one lives
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const dust = [];
let last = 0;

function frame(ms) {
  const dt = Math.min(0.05, (ms - last) / 1000); last = ms;
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(layer, 0, 0);
  ctx.setTransform(devicePixelRatio || 1, 0, 0, devicePixelRatio || 1, 0, 0);
  if (still) return;
  for (let n = 0; n < RATE; n++) {
    const p = P[rnd() * P.length | 0];
    dust.push({ hx: ox + p.gx * cell, hy: oy + p.gy * cell, ch: p.ch, age: 0,
      ax: 0.3 + rnd(), ay: 0.2 + rnd() * 0.9, wob: rnd() * 6.28 });
  }
  const reach = W * 0.45;
  for (let i = dust.length - 1; i >= 0; i--) {
    const d = dust[i];
    d.age += dt / LIFE;
    if (d.age >= 1) { dust[i] = dust[dust.length - 1]; dust.pop(); continue; }
    const u = d.age * d.age;
    const x = d.hx + u * d.ax * reach + Math.sin(u * 9 + d.wob) * u * cell * 6;
    const y = d.hy - u * d.ay * reach * 0.6 + Math.cos(u * 7 + d.wob) * u * cell * 4;
    ctx.fillStyle = `rgba(255,255,255,${1 - d.age})`;
    ctx.fillText(u < 0.01 ? d.ch : DUST[Math.min(DUST.length - 1, d.age * DUST.length | 0)], x, y);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// gutter: flowing ascii field between the screen edge and the border.
// glows around the cursor; click/tap anywhere sends a ripple through it.
{
  const bg = document.getElementById("bg"), g = bg.getContext("2d"), main = document.querySelector("main");
  const C = 14, RAMP = " .:-=+*#%@";
  let cells = [], mx = -1e4, my = -1e4;
  const ripples = [];
  function layout() {
    const dpr = devicePixelRatio || 1, r = main.getBoundingClientRect();
    bg.width = innerWidth * dpr; bg.height = innerHeight * dpr;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.font = `${C}px ui-monospace, Menlo, monospace`; g.textAlign = "center"; g.textBaseline = "middle";
    cells = [];
    for (let y = C / 2; y < innerHeight; y += C) for (let x = C / 2; x < innerWidth; x += C)
      if (x < r.left - 4 || x > r.right + 4 || y < r.top - 4 || y > r.bottom + 4) cells.push(x, y);
  }
  addEventListener("resize", layout);
  layout();
  addEventListener("pointermove", e => { mx = e.clientX; my = e.clientY; });
  addEventListener("pointerdown", e => ripples.push({ x: e.clientX, y: e.clientY, t: performance.now() }));
  function draw(ms) {
    const t = ms / 1000;
    g.clearRect(0, 0, innerWidth, innerHeight);
    while (ripples.length && ms - ripples[0].t > 2500) ripples.shift();
    for (let i = 0; i < cells.length; i += 2) {
      const x = cells[i], y = cells[i + 1];
      let v = (Math.sin(x * .011 + t * .9) * Math.cos(y * .009 - t * .7) + Math.sin((x + y) * .006 + t * 1.3)) / 4 + .5;
      const dx = x - mx, dy = y - my;
      v += 1.2 * Math.exp(-(dx * dx + dy * dy) / 9000);
      for (const rp of ripples) {
        const age = (ms - rp.t) / 1000, d = Math.hypot(x - rp.x, y - rp.y) - age * 600;
        v += Math.exp(-d * d / 1200) * (1 - age / 2.5);
      }
      v = Math.min(1, v * (still ? 0.6 : 1));
      const c = RAMP[v * (RAMP.length - 1) | 0];
      if (c === " ") continue;
      g.fillStyle = `rgba(255,255,255,${.12 + v * .6})`;
      g.fillText(c, x, y);
    }
    if (!still) requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
}
</script>
